# Global settings. Everything else lives in conf.d/ (loaded in filename order):
#   00-env          environment variables
#   10-runtimes     language runtimes and package managers
#   20-cli          general CLI tools
#   30-ai           AI coding agents and MCP servers
#   40-infra        infrastructure / cloud tools
#   50-bootstrap-*  `mise bootstrap` system setup (dnf hosts only, gated by chezmoi)
#   90-tasks        global tasks
#   99-local        machine-private overrides, never overwritten by chezmoi
# `mise use -g` writes here; move new tools into the matching conf.d file.

[settings]
experimental = true
idiomatic_version_file = true
disable_backends = ["ubi"]  # deprecated; use github: instead

