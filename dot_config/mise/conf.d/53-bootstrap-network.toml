# Fedora networking: Tailscale and NetBird mesh VPNs. On macOS use the Mac App Store app: the
# standalone build needs a system extension that MDM may block.
# Apply with: mise bootstrap --only files,packages,services
# then sign in once with: sudo tailscale up / netbird up

[bootstrap.files."/etc/yum.repos.d/tailscale.repo"]
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0644"
content = """
[tailscale-stable]
name=Tailscale stable
baseurl=https://pkgs.tailscale.com/stable/fedora/$basearch
enabled=1
type=rpm
repo_gpgcheck=1
gpgcheck=1
gpgkey=https://pkgs.tailscale.com/stable/fedora/repo.gpg
"""

[bootstrap.files."/etc/yum.repos.d/netbird.repo"]
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0644"
content = """
[netbird]
name=netbird
baseurl=https://pkgs.netbird.io/yum/
enabled=1
gpgcheck=1
gpgkey=https://pkgs.netbird.io/yum/repodata/repomd.xml.key
repo_gpgcheck=1
"""

[bootstrap.packages]
"dnf:tailscale" = "latest"
# the RPM's post-install runs `netbird service install/start`, which creates netbird.service
"dnf:netbird" = "latest"
# desktop tray app (Fedora 43+); NetBird's docs list its GTK/WebKit runtime explicitly
"dnf:netbird-ui" = "latest"
"dnf:gtk4" = "latest"
"dnf:webkitgtk6.0" = "latest"
"dnf:xdg-utils" = "latest"

[bootstrap.services.tailscaled]
state = "running"
enabled = true

[bootstrap.services.netbird]
state = "running"
enabled = true
