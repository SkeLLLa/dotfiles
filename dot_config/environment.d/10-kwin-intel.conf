# Pin Plasma Wayland (kwin) to the Intel iGPU (PCI 00:02.0), which drives the
# internal panel. The NVIDIA dGPU is compute-only (CUDA/ollama) and has no CRTC
# ("Cannot find any crtc or sizes"), so kwin gets zero outputs if it picks it --
# black screen with a cursor.
#
# Use the stable /dev/dri/intel-card alias (see
# /etc/udev/rules.d/61-drm-intel-alias.rules), NOT a bare cardN: the numbering
# flips depending on whether nvidia_drm loads before i915.
# NOTE: no colons in the value -- kwin treats ':' as a device-list separator.
KWIN_DRM_DEVICES=/dev/dri/intel-card
